<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scripture Listener</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Scripture Listener</h1>
    <span id="pp-status" class="pill">ProPresenter: checking…</span>
    <div class="segmented" id="style-switch" role="group" aria-label="Display style">
      <button type="button" data-style="fullScreen">Full screen</button>
      <button type="button" data-style="lowerThird">Lower third</button>
    </div>
    <label class="toggle"><input type="checkbox" id="auto-send" /> Auto-send</label>
    <button id="listen" class="primary">🎤 Start listening</button>
  </header>

  <main>
    <section class="panel live">
      <h2>On screen now</h2>
      <div id="live-ref" class="ref">—</div>
      <div id="live-text" class="verse muted">Nothing showing.</div>
      <div class="row">
        <button id="prev">◀ Prev verse</button>
        <button id="next">Next verse ▶</button>
        <button id="clear" class="danger">Clear screen</button>
      </div>
      <form id="manual" class="row">
        <input id="manual-ref" placeholder="Reference (John 3:16-18) or words (love is patient)" autocomplete="off" />
        <button type="submit">Show / Search</button>
      </form>
      <ul id="search-results" class="results"></ul>
    </section>

    <section class="panel">
      <h2>Detected references</h2>
      <ul id="queue"><li class="muted empty">References you speak will appear here.</li></ul>
    </section>

    <section class="panel transcript-panel">
      <h2>Transcript</h2>
      <div id="transcript"><span id="final"></span><span id="interim" class="muted"></span></div>
    </section>

    <details class="panel" id="settings">
      <summary>Settings</summary>
      <form id="settings-form" class="grid">
        <label>ProPresenter IP <input name="ppHost" /></label>
        <label>ProPresenter port <input name="ppPort" type="number" /></label>
        <label class="check"><input name="sendToMessage" type="checkbox" /> Show on audience screen (Message)</label>
        <label>Message name <input name="messageName" /></label>
        <label>Reference token <input name="referenceToken" /></label>
        <label>Verse text token <input name="textToken" /></label>
        <label>Full screen slide <select name="fullScreenSlide" class="slide-select"></select></label>
        <label>Lower third slide <select name="lowerThirdSlide" class="slide-select"></select></label>
        <label class="check"><input name="sendToStage" type="checkbox" /> Also send to stage display</label>
        <label class="check"><input name="storyDetection" type="checkbox" /> Detect retold Bible stories (Cloudflare AI)</label>
        <label>Translation
          <select name="translation">
            <option value="kjv">King James Version (KJV)</option>
            <option value="bsb">Berean Standard Bible (BSB)</option>
            <option value="web">World English Bible (WEB)</option>
            <option value="asv">American Standard Version (ASV)</option>
            <option value="bbe">Bible in Basic English (BBE)</option>
            <option value="darby">Darby</option>
            <option value="ylt">Young's Literal (YLT)</option>
          </select>
        </label>
        <label>Speech language
          <select name="language">
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="en-NG">English (Nigeria)</option>
            <option value="en-GH">English (Ghana)</option>
            <option value="en-KE">English (Kenya)</option>
            <option value="en-ZA">English (South Africa)</option>
            <option value="en-AU">English (Australia)</option>
            <option value="en-IN">English (India)</option>
          </select>
        </label>
        <div class="row">
          <button type="submit" class="primary">Save</button>
          <button type="button" id="test-pp">Test connection</button>
        </div>
      </form>
      <p class="muted small">Web display for OBS or ProPresenter Web content: <a href="/display" target="_blank">/display</a></p>
    </details>
  </main>

  <div id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
